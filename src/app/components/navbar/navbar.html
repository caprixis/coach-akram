<header class="navbar" [class.scrolled]="isScrolled">
  <div class="navbar-container">
    
    <!-- Brand Logo -->
    <a class="brand-logo" (click)="onNavClick('home')">
      AKRAM <span class="accent">RAMADAN</span>
    </a>

    <!-- Navigation Drawer Links -->
    <nav class="nav-menu" [class.active]="isMobileMenuOpen">
      <ul class="nav-list">
        @for (item of navItems; track item.id) {
          <li class="nav-item">
            <button 
              class="nav-link" 
              [class.active]="activeSection === item.target"
              (click)="onNavClick(item.target)">
              {{ currentLanguage === 'EN' ? item.labelEn : item.labelAr }}
            </button>
          </li>
        }
      </ul>
    </nav>

    <!-- Action Buttons -->
    <div class="nav-actions">
      <!-- Language Switcher -->
      <button class="lang-btn" (click)="toggleLanguage()">
        {{ currentLanguage === 'EN' ? 'عربي' : 'EN' }}
      </button>

      <!-- Primary CTA -->
      <button class="cta-btn" (click)="openWhatsApp()">
        {{ currentLanguage === 'EN' ? 'Free Consultation' : 'استشارة مجانية' }}
      </button>

      <!-- Mobile Hamburger Toggle -->
      <button 
        class="hamburger" 
        [class.open]="isMobileMenuOpen" 
        (click)="toggleMobileMenu()"
        aria-label="Toggle navigation menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>

  </div>
</header>

@if (isMobileMenuOpen) {
  <div class="mobile-backdrop" (click)="closeMobileMenu()"></div>
